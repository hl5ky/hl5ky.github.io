<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" class="no-js">
<head>
  {{ partial "head.html" . }}
  <style>
    /* 여백 및 기본 레이아웃 조정 */
    body {
      padding: 2.5rem 1.5rem;
      background-color: #fff;
    }
    .standalone-content {
      max-width: 900px;
      margin: 0 auto;
    }
  </style>
</head>
<body class="td-page">
  <main class="standalone-content">
    <div class="td-content">
      <h1>{{ .Title }}</h1>
      {{ .Content }}
    </div>
  </main>
  {{ partial "scripts.html" . }}
</body>
</html>
